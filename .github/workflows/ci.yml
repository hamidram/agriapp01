name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        # Install the project locally in editable mode so tests can import modules smoothly
        pip install -e .
        pip install pytest httpx

    - name: Run Unit Tests
      run: |
        python -m pytest -v